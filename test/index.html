<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZeroPlot Tests</title>
<link rel="stylesheet" href="../site/styles.css">
<style>
  .report { max-width: 980px; margin: 0 auto; padding-block: 24px 48px; padding-inline: 16px; }
  .report h1 { margin: 0 0 4px; font-size: var(--text-xl); font-weight: 650; }
  .totals { margin: 0 0 20px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .totals strong { color: var(--ink); }
  .suite { margin-bottom: 12px; padding: 12px 16px; }
  .suite h2 { margin: 0 0 6px; font-size: var(--text-md); font-weight: 600; }
  .suite ul { margin: 0; padding: 0; list-style: none; }
  .suite li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; padding: 2px 0; font-size: var(--text-sm); }
  .suite li .ms { color: var(--ink-3); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
  .suite li.failed { color: var(--danger); }
  .suite pre { grid-column: 2 / -1; margin: 4px 0 6px; white-space: pre-wrap; font-size: var(--text-xs); }
  .status-passed::before { content: "✓"; color: #1baf7a; }
  .status-failed::before { content: "✗"; color: var(--danger); }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html" aria-label="ZeroPlot home">
    <span class="brand-name">ZeroPlot</span>
  </a>
  <nav class="nav" aria-label="Site">
    <a href="../index.html">Builder</a>
    <a href="../examples.html">Examples</a>
    <a href="index.html" aria-current="page">Tests</a>
  </nav>
</header>
<main class="report">
  <h1>Test results</h1>
  <p class="totals" id="totals" aria-live="polite">Running…</p>
  <div id="results"></div>
</main>
<script type="module">
  import { run } from './harness.js';
  import './specs/index.js';

  const results = document.getElementById('results');
  const suites = new Map();

  const summary = await run({
    inBrowser: true,
    onResult(result) {
      let list = suites.get(result.suite);
      if (!list) {
        const section = document.createElement('section');
        section.className = 'panel suite';
        const heading = document.createElement('h2');
        heading.textContent = result.suite;
        list = document.createElement('ul');
        section.append(heading, list);
        results.appendChild(section);
        suites.set(result.suite, list);
      }
      const item = document.createElement('li');
      item.className = result.status;
      const mark = document.createElement('span');
      mark.className = `status-${result.status}`;
      const name = document.createElement('span');
      name.textContent = result.name;
      const time = document.createElement('span');
      time.className = 'ms';
      time.textContent = `${result.ms.toFixed(1)} ms`;
      item.append(mark, name, time);
      if (result.error) {
        const detail = document.createElement('pre');
        detail.textContent = result.error.stack || result.error.message;
        item.appendChild(detail);
      }
      list.appendChild(item);
    },
  });

  document.getElementById('totals').innerHTML = '';
  const totals = document.getElementById('totals');
  const strong = document.createElement('strong');
  strong.textContent = `${summary.passed} passed`;
  totals.append(strong, `, ${summary.failed} failed, ${summary.skipped} skipped`);
  window.testSummary = summary;
</script>
</body>
</html>
