<!doctype html>
<html lang="en">

<!--
PAGE HEAD START (meta settings & stylesheet reference)
//-->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZeroPlot</title>
<meta name="description" content="Paste CSV data and draw a line or scatter plot with ZeroPlot, a plotting library written from scratch in plain JavaScript.">
<link rel="stylesheet" href="app_main/stylesheets/styles_main.css">
</head>

<!--
PAGE BODY START
//-->

<body>
<header class="topbar">
  <!-- Logo Section -->
  <span class="brand">
    <!-- Logo Creation -->
    <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
      <rect x="0.5" y="0.5" width="27" height="27" rx="7" fill="#eaf1fb" stroke="#d3d2cb"/>
      <path d="M6 5.5V22h16.5" fill="none" stroke="#8a8983" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M8.5 18.5 13 14l3 2.5 5-7" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="13" cy="14" r="1.9" fill="#2a78d6"/>
      <circle cx="21" cy="9.5" r="1.9" fill="#2a78d6"/>
    </svg>
    <span class="brand-name">ZeroPlot</span>
  </span>
</header>

<main class="layout">
  <section class="panel plot-panel" aria-label="Plot">
    <div class="toolbar">
      <div class="segmented" role="radiogroup" aria-label="Plot type">
        <label><input type="radio" name="plot-type" value="line" checked><span>Line</span></label>
        <label><input type="radio" name="plot-type" value="scatter"><span>Scatter</span></label>
      </div>
    </div>
    <div class="chart" id="chart"></div>
  </section>

  <aside class="panel rail" aria-label="Plot settings">
    <section class="rail-section">
      <h2>Data</h2>
      <label class="field" for="csv">
        <span>CSV data: first column x, second column y</span>
        <textarea id="csv" rows="14" spellcheck="false" autocomplete="off"></textarea>
      </label>
      <div class="actions">
        <button class="button button-primary" type="button" id="apply">Apply data</button>
        <span class="hint">or <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="rail-section">
      <h2>Axis titles</h2>
      <label class="field" for="x-label">
        <span>X axis</span>
        <input type="text" id="x-label" autocomplete="off">
      </label>
      <label class="field" for="y-label">
        <span>Y axis</span>
        <input type="text" id="y-label" autocomplete="off">
      </label>
    </section>
  </aside>

  <section class="panel table-panel" aria-labelledby="table-title">
    <div class="panel-head">
      <h2 id="table-title">Data table</h2>
      <span class="hint" id="table-note"></span>
    </div>
    <div class="table-wrap" id="table" tabindex="0" aria-labelledby="table-title"></div>
  </section>
</main>

<!--
PAGE SCRIPT SECTION
//-->

<script type="module" src="app_main/page_scripts/app.js"></script>
</body>
</html>
