<!doctype html>
<html lang="en">

<!--
PAGE HEAD START (meta settings & stylesheet reference)
//-->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plotting Library: Warmup Exercise Team 06</title>
<meta name="description" content="Paste CSV data and draw a line or scatter plot with a plotting library written from scratch in plain JavaScript.">
<link rel="stylesheet" href="app_main/stylesheets/styles_main.css">
</head>

<!--
PAGE BODY START
//-->

<body>
<header class="topbar">
  <!-- Page Title -->
  <h1 class="page-title">Plotting Library: Warmup Exercise Team 06</h1>
</header>

<main class="layout">
  <section class="panel plot-panel" aria-label="Plot">
    <div class="toolbar">
      <div class="segmented" role="radiogroup" aria-label="Plot type">
        <label><input type="radio" name="plot-type" value="line" checked><span>Line</span></label>
        <label><input type="radio" name="plot-type" value="scatter"><span>Scatter</span></label>
      </div>
      <div class="actions">
        <button class="button" type="button" id="download-svg">Download SVG</button>
        <button class="button" type="button" id="download-png">Download PNG</button>
      </div>
    </div>
    <!-- The script redraws #chart; the tooltip sits beside it so a redraw keeps it. -->
    <div class="chart">
      <div id="chart"></div>
      <div class="tooltip" id="tooltip" aria-hidden="true" hidden></div>
    </div>
  </section>

  <aside class="panel rail" aria-label="Plot settings">
    <section class="rail-section">
      <h2>Data</h2>
      <label class="field" for="csv">
        <span>CSV data: first column x, one further column per series</span>
        <textarea id="csv" rows="14" spellcheck="false" autocomplete="off"></textarea>
      </label>
      <div class="actions">
        <button class="button button-primary" type="button" id="apply">Apply data</button>
        <span class="hint">or <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>
        <button class="button" type="button" id="load-file">Load CSV file</button>
      </div>
      <!-- Clicking Load CSV file clicks this hidden input to open the file picker. -->
      <input type="file" id="file-input" accept=".csv,.tsv,.txt" hidden>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="rail-section">
      <h2>Axis titles</h2>
      <label class="field" for="x-label">
        <span>X axis</span>
        <input type="text" id="x-label" autocomplete="off">
      </label>
      <label class="field" for="y-label">
        <span>Y axis</span>
        <input type="text" id="y-label" autocomplete="off">
      </label>
    </section>
  </aside>

  <section class="panel table-panel" aria-labelledby="table-title">
    <div class="panel-head">
      <h2 id="table-title">Data table</h2>
      <span class="hint" id="table-note"></span>
    </div>
    <div class="table-wrap" id="table" tabindex="0" aria-labelledby="table-title"></div>
  </section>
</main>

<!--
PAGE SCRIPT SECTION
//-->

<script type="module" src="app_main/page_scripts/app.js"></script>
</body>
</html>
